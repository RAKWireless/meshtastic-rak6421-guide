services:
  meshmonitor:
    image: ghcr.io/yeraze/meshmonitor:latest
    container_name: meshmonitor
    ports:
      - "8080:3001"
      - "1883:1883"
    restart: unless-stopped
    volumes:
      - meshmonitor-data:/data
    # Created by setup.sh. On a new volume, these values create the first TCP
    # source automatically. In MQTT mode, the file intentionally has no TCP
    # source values.
    env_file:
      - ./meshmonitor.env
    environment:
      # CORS allowed origins — * permits any origin for debugging only.
      # Change to your actual domain(s) (e.g. http://192.168.1.10:8081) before production use.
      - ALLOWED_ORIGINS=*

volumes:
  meshmonitor-data:
    driver: local

